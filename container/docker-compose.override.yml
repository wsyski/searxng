# Local deployment on top of the upstream docker-compose.yml, kept separate so
# upstream merges do not conflict. Compose loads this file automatically.
#
#   .env       committed: image pin, publish address/port, base URL
#   .env.prod  gitignored: SEARXNG_SECRET (overrides server.secret_key)
#
# Firecrawl reaches this instance at SEARXNG_ENDPOINT=http://192.168.1.100:8888.

services:
  core:
    env_file:
      - ./.env
      - ./.env.prod
    volumes:
      # core-config (settings.yml) is bind-mounted in docker-compose.yml, not
      # here. If it ever comes back owned by an id the host user owns nothing by,
      # the image entrypoint's `chown -R searxng:searxng` ran with
      # FORCE_OWNERSHIP unset - its default is true - and rootless docker mapped
      # container uid 977 to host 100976. FORCE_OWNERSHIP=false in ./.env is what
      # stops it. See DESIGN.md -> Local deployment for the recovery command.
      # Fork-local engines, single files rather than the whole engines directory
      # so the image's other engines (2026.10.9-f4822b3fc) stay untouched. The image is pinned, so
      # anything in searx/engines/ is invisible to the container without this —
      # an engine that is written and registered but not mounted simply does not
      # appear in /config, and there is no error to tell you why.
      # Drop these mounts once the engines are upstream or the pin moves past them.
      - ../searx/engines/liferay_forum.py:/usr/local/searxng/searx/engines/liferay_forum.py:ro
      - ../searx/engines/sii.py:/usr/local/searxng/searx/engines/sii.py:ro
      - ../searx/engines/dnarynkow.py:/usr/local/searxng/searx/engines/dnarynkow.py:ro
      - ../searx/engines/ksiazak.py:/usr/local/searxng/searx/engines/ksiazak.py:ro
      # Opt-in only, disabled in core-config: /search/ is a PAP news index and
      # the site's robots.txt disallows this engine (see its module docstring).
      - ../searx/engines/stooq.py:/usr/local/searxng/searx/engines/stooq.py:ro
      # Upstream engine, patched fork-side to read a GitHub token from the
      # environment (see the comment in searx/engines/github.py). Without this
      # mount the container keeps the pristine image copy and the patch is a
      # silent no-op: the repo would look patched while nothing changed.
      - ../searx/engines/github.py:/usr/local/searxng/searx/engines/github.py:ro

  # Unused: settings.yml has limiter off and no valkey.url. Start it with
  # `docker compose --profile valkey up -d` if that changes.
  valkey:
    profiles: [valkey]
