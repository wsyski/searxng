# Local deployment on top of the upstream docker-compose.yml, kept separate so
# upstream merges do not conflict. Compose loads this file automatically.
#
#   .env       committed: image pin, publish address/port, base URL
#   .env.prod  gitignored: SEARXNG_SECRET (overrides server.secret_key)
#
# Firecrawl reaches this instance at SEARXNG_ENDPOINT=http://192.168.1.100:8888.

services:
  core:
    environment:
      # EVERY BIND-MOUNTED .py FILE IN THIS SERVICE IS INERT WITHOUT THIS.
      # The image ships precompiled bytecode in `searx/**/__pycache__`, written
      # with PEP 552 *unchecked hash* invalidation (`flags=1`, check_source off),
      # which tells CPython to use the .pyc and never look at the .py beside it.
      # So a mounted module is read only if the image has no .pyc for it.
      # Measured 2026-10-30 inside the container:
      #   searx/engines/__pycache__/sii.cpython-314.pyc      flags=0  (fork-local,
      #       absent from the image, compiled from the mount on first import - works)
      #   searx/engines/__pycache__/github.cpython-314.pyc   flags=1  (upstream
      #       engine, baked at image build - the fork-side token patch below was
      #       NEVER executed, and nothing said so)
      # PYTHONPYCACHEPREFIX moves the cache lookup out of the package tree
      # entirely, so the baked .pyc files are not consulted and every module is
      # compiled from the source that is actually there. It costs one cold
      # compile of the tree at startup.
      PYTHONPYCACHEPREFIX: /tmp/pycache
    env_file:
      - ./.env
      - ./.env.prod
    volumes:
      # core-config (settings.yml) is bind-mounted in docker-compose.yml, not
      # here. If it ever comes back owned by an id the host user owns nothing by,
      # the image entrypoint's `chown -R searxng:searxng` ran with
      # FORCE_OWNERSHIP unset - its default is true - and rootless docker mapped
      # container uid 977 to host 100976. FORCE_OWNERSHIP=false in ./.env is what
      # stops it. See DESIGN.md -> Local deployment for the recovery command.
      # Fork-local engines, single files rather than the whole engines directory
      # so the image's other engines (2026.10.9-f4822b3fc) stay untouched. The image is pinned, so
      # anything in searx/engines/ is invisible to the container without this —
      # an engine that is written and registered but not mounted simply does not
      # appear in /config, and there is no error to tell you why.
      # Drop these mounts once the engines are upstream or the pin moves past them.
      - ../searx/engines/liferay_forum.py:/usr/local/searxng/searx/engines/liferay_forum.py:ro
      - ../searx/engines/sii.py:/usr/local/searxng/searx/engines/sii.py:ro
      - ../searx/engines/dna_rynkow.py:/usr/local/searxng/searx/engines/dna_rynkow.py:ro
      - ../searx/engines/ksiazak.py:/usr/local/searxng/searx/engines/ksiazak.py:ro
      # Opt-in only, disabled in core-config: /search/ is a PAP news index and
      # the site's robots.txt disallows this engine (see its module docstring).
      - ../searx/engines/stooq.py:/usr/local/searxng/searx/engines/stooq.py:ro
      # Swedish subset (finance + finance sweden), added 2026-10-30 for the two
      # Avanza books. Both read a public search surface with no robots.txt or
      # TDM objection, unlike stooq above.
      - ../searx/engines/aktienyheterna.py:/usr/local/searxng/searx/engines/aktienyheterna.py:ro
      - ../searx/engines/placera.py:/usr/local/searxng/searx/engines/placera.py:ro
      # Upstream engine, patched fork-side to read a GitHub token from the
      # environment (see the comment in searx/engines/github.py). Without this
      # mount the container keeps the pristine image copy and the patch is a
      # silent no-op: the repo would look patched while nothing changed.
      - ../searx/engines/github.py:/usr/local/searxng/searx/engines/github.py:ro
      # Core files, not engines. The JSON response gained two fields it could not
      # express before: `unknown_engines` (the `engines=` pins this instance does
      # not have - SearXNG drops them and runs the DEFAULT search, and until now
      # said nothing) and `engine_data` (the documented engine->client channel,
      # which the HTML page round-trips through hidden form fields and the JSON
      # encoder simply omitted; searx.engines.sii publishes its drop count there).
      #
      # These three are mountable only because they carried NO fork change before
      # this one: each was byte-identical to the pinned image, checked with
      #   docker exec searxng-core cat /usr/local/searxng/searx/webutils.py \
      #     | diff - <(git show HEAD:searx/webutils.py)
      # searx/webapp.py is NOT identical (the image still has /image_proxy, HEAD
      # has /image), so it is deliberately neither patched nor mounted: the field
      # is reported in the JSON response only, which is what the consumers read.
      # That diff now shows the fork hunks, so the rule going forward is: when
      # SEARXNG_VERSION in ./.env moves, RE-RUN ALL THREE DIFFS and confirm each
      # one differs from the new image ONLY by the fork hunks. Anything else is
      # upstream drift being silently reverted by the mount.
      - ../searx/webadapter.py:/usr/local/searxng/searx/webadapter.py:ro
      - ../searx/webutils.py:/usr/local/searxng/searx/webutils.py:ro
      - ../searx/search/models.py:/usr/local/searxng/searx/search/models.py:ro

  # Unused: settings.yml has limiter off and no valkey.url. Start it with
  # `docker compose --profile valkey up -d` if that changes.
  valkey:
    profiles: [valkey]
