# SearXNG settings for the local deployment (container/docker-compose.yml).
#
# Firecrawl (/opt/playground/firecrawl) uses this instance as its search provider:
#   GET {SEARXNG_ENDPOINT}/search?q=...&format=json
# so the JSON format MUST be enabled here. SearXNG ships with only `html`,
# which is why a misconfigured instance returns 200 and zero results - the
# response parses fine, it just has no .results array.
#
# Editing: this file is owned by the host user (FORCE_OWNERSHIP=false in
# container/.env), so edit it in place, then apply with
#   docker restart searxng-core
# Firecrawl needs no restart; it inherits whatever engines this enables and can
# only narrow them, via SEARXNG_ENGINES / SEARXNG_CATEGORIES /
# SEARXNG_NEWS_CATEGORIES in its own .env.
use_default_settings: true

general:
  instance_name: "local searxng"
  debug: false

server:
  # Bind on all interfaces inside the container. The host side is published on
  # SEARXNG_HOST (container/.env, the LAN address), which makes this an open
  # search proxy for the LAN: keep it off untrusted networks. (server.port is
  # ignored in the container, see SEARXNG_PORT in container/.env.)
  bind_address: "0.0.0.0"
  port: 8888
  # secret_key comes from SEARXNG_SECRET in container/.env.prod (gitignored).
  limiter: false
  image_proxy: false


search:
  formats:
    - html
    - json

# A tab is a selector, not a pipeline: engines in `finance` / `finance-poland` /
# `finance-sweden` run only when one of those categories is requested
# (`categories=...`, `-c ...`, or the UI tab). `finance` is international/general
# finance; `finance-poland` and `finance-sweden` are its per-market subsets, and
# every finance engine carries `finance` plus exactly one of them. They no longer
# run in default `general` or `news` searches. Adding a key here replaces the default map wholesale
# (searx/settings_loader.py:138), so every default tab is copied below.
categories_as_tabs:
  general:
  images:
  videos:
  news:
  map:
  music:
  it:
  science:
  files:
  social media:
  finance:
  finance-poland:
  finance-sweden:

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 20
  pool_maxsize: 10

# Engines probed from this egress IP on 2026-10-10 (q=..., engines=<one>):
# answering: yahoo, "duckduckgo web", mwmbl. Blocked: duckduckgo (CAPTCHA), brave and
# google cse (429, 180 s suspensions that slow every query), google ("access denied"),
# qwant (CAPTCHA), bing (connection error), yep. Re-probe before re-enabling one:
#   curl -G .../search --data-urlencode q=test --data-urlencode engines=<name> \
#     --data-urlencode format=json | jq '.results|length, .unresponsive_engines'
engines:
  - name: yahoo
    disabled: false
  - name: duckduckgo web
    disabled: false
  - name: mwmbl
    disabled: false
  - name: wikipedia
    disabled: false
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: google cse
    disabled: true
  # Developer (it/packages/repos): off by default upstream, answering here.
  # github, stackoverflow, askubuntu, superuser, mdn, pypi, docker hub are on by default.
  - name: npm
    disabled: false
  - name: pkg.go.dev
    disabled: false
  - name: lib.rs
    disabled: false
  - name: huggingface
    disabled: false
  - name: hackernews
    disabled: false
  # Liferay community forum (discuss.liferay.com). Not an upstream engine: added
  # here because use_default_settings appends unknown engine names. Verified
  # 2026-10-11 against search.json; Discourse 429s non-browser clients, which
  # SearXNG avoids via curl_cffi impersonation.
  - name: liferay forum
    engine: liferay_forum
    shortcut: lf
    categories: it
    disabled: false
  # The six finance engines below are in the `finance`, `finance-poland` and
  # `finance-sweden` tabs (see categories_as_tabs above). They do not run in
  # default general/news searches; request the category explicitly
  # (`-c finance-poland`, `-c finance-sweden`, `!finance-poland`, or the
  # portfolio jobs' categories=finance-poland / categories=finance-sweden
  # calls). The first four are Polish, the last two Swedish; `finance` is the
  # union and is what a question with no market in it should ask for. The
  # per-market split is what keeps each portfolio book stable: a new Swedish
  # engine joins `finance` and `finance-sweden` and the Polish book does not
  # change, which is the whole reason the DeGiro job asks for the subset rather
  # than for `finance`.
  # A category this instance does not have is NOT reported - a misspelled
  # `categories=finance-polnd` silently runs the default general search
  # (measured 2026-10-30: 36 rows from mwmbl/duckduckgo web/yahoo, empty
  # unknown_engines). unknown_engines covers engine pins only.
  # SII - Stowarzyszenie Inwestorow Indywidualnych (sii.org.pl), Poland's
  # individual-investor association. Per-company commentary that names a GPW
  # ticker in the title, which is what makes it searchable. Not an upstream
  # engine. Verified 2026-10-11: /szukaj?search= returns 10 results each for
  # orlen, kghm, budimex and cd projekt.
  # Two traps, both handled in the engine and both worth not rediscovering.
  # The parameter is `search`, NOT `q`: ?q= answers HTTP 200 with one identical
  # 62,576-byte page for EVERY query including a nonsense one, so a wrong
  # parameter reads as a healthy engine that found nothing. And a query that
  # matches nothing answers 404, not an empty 200, so the engine sets
  # raise_for_httperror = False and returns zero results instead of failing.
  # robots.txt carries no AI-agent rule; `User-agent: *` disallows only asset
  # paths. The engine identifies as SearXNG/1.0: the site rejects a bare
  # "Mozilla/5.0" and "curl/8.5.0" with an empty shell but serves a full page
  # to any realistic agent string, so honesty costs nothing here.
  - name: sii
    engine: sii
    categories: [finance, finance-poland]
    shortcut: sii
    disabled: false
  # DNA Rynkow (dnarynkow.pl) - per-company cards for ~100 listed names.
  # Not an upstream engine. Verified 2026-10-11.
  # The search is a PARAMETER on the stock index, not a search page: there is no
  # /szukaj route, no WordPress REST API and no sitemap entry for it, so every
  # path-shaped probe 404s while ?search= works. Two things that mislead:
  # the ~2.5 kB __NUXT_DATA__ payload holds no stock data - the result rows are
  # server-rendered into the HTML body, so a payload-only check concludes the
  # site is client-rendered; and `page` is 1-based in effect, since page=0 and
  # page=1 both return the first page.
  # robots.txt names ClaudeBot, Claude-User, Claude-SearchBot, GPTBot and a
  # dozen others under `Allow: /`; only /pulpit is disallowed and is never
  # requested here. Coverage is partial - Orlen has no card and returns zero.
  - name: dna rynkow
    engine: dnarynkow
    categories: [finance, finance-poland]
    shortcut: dna
    disabled: false
  # Ksiazak (konradksiazak.pl) - a small office publishing long-form single-company
  # notes. Not an upstream engine. Verified 2026-10-11.
  # Do NOT judge this source by archive size. Six posts about six companies is the
  # product, not a shortfall: the question is "has this office written about a name
  # I hold?", where one hit is the signal and empty is the normal answer. An engine
  # that is rarely non-empty can be the highest-signal source in the set.
  # Reads the public WordPress REST API rather than scraping HTML.
  - name: ksiazak
    engine: ksiazak
    categories: [finance, finance-poland]
    shortcut: ksz
    disabled: false
  # Stooq (stooq.com) - a Polish market portal whose /search/ is a PAP *news*
  # index, not an instrument search (ticker lookup is /q/s/, exact-symbol only).
  # ENABLED, but in the finance and finance-poland categories only (the tabs above):
  #   - robots.txt is `User-agent: * / Disallow: /`; only Bingbot and Googlebot
  #     are allowed. This is the one engine here that ignores that directive.
  #   - the page sits behind a SHA-256 proof-of-work gate and a Google consent
  #     wall. The engine solves the PoW and sets privacy=1, which is a consent
  #     cookie set without consent. Both were the operator's explicit decision.
  # Finance-only keeps it out of default news/general searches, including
  # Firecrawl's (SEARXNG_NEWS_CATEGORIES=news). The portfolio requests
  # categories=finance-poland once a day, which is its scheduled cap; manual
  # calls:
  #   !stq <terms>                              (UI / HTML search)
  #   categories=finance-poland&format=json     (API)
  # Measured 2026-10-24; see searx/engines/stooq.py for the full measurement.
  - name: stooq
    engine: stooq
    shortcut: stq
    categories: [finance, finance-poland]
    disabled: false
  # --- Swedish subset (`finance` + `finance-sweden`) ---------------------------
  # Added 2026-10-30 for the two Avanza books (23 and 17 Swedish names), which
  # had 23 RSS feeds and no way to ask "has anyone written about Gränges".
  # Aktienyheterna (aktienyheterna.se) - a Swedish retail-equity blog, the
  # Swedish counterpart of `ksiazak`: a small archive whose worth is coverage of
  # a name you hold, not volume. Reads the public WordPress REST API. Not an
  # upstream engine. Verified 2026-10-30.
  # THE TRAP: WordPress `search` matches a SUBSTRING of the body, so
  # ?search=granges returns two posts and NEITHER is about Gränges - both are
  # Spendrups sustainability write-ups naming **Grängesberg**, the town the
  # brewery was founded in. Two confident rows about a brewery are worse than
  # none: a gap is visible, a false hit reads as coverage. The engine keeps a row
  # only when every query term appears as a WHOLE WORD in title, excerpt or body,
  # and publishes what it dropped through engine_data. Measured site -> kept:
  # granges 2 -> 0, swedbank 10 -> 10, cloetta 3 -> 3, castellum 10 -> 9,
  # telia 10 -> 10, apotea 3 -> 3.
  # Do NOT switch this to the HTML ?s= page for looking more productive: a
  # nonsense query already returns 5 /blog/ links there (sidebar furniture), so
  # granges 7 and swedbank 15 are the same REST yield plus a fixed noise floor.
  # robots.txt (2026-10-30): `User-agent: *` disallows only /wp-admin/, no
  # AI-agent rule; /.well-known/tdmrep.json is 404 and no page carries a
  # tdm-reservation meta.
  - name: aktienyheterna
    engine: aktienyheterna
    categories: [finance, finance-sweden]
    shortcut: akn
    disabled: false
  # Placera (placera.se) - Avanza's editorial site: /nyheter, /analys and the
  # /pressmeddelanden wire, archive back to 2006. The one Swedish source here
  # that can answer "has anyone EVER written about this holding". Not an
  # upstream engine. Verified 2026-10-30.
  # The path is /search?q=, NOT /sok: /sok?q=, /sok/<q> and /soek?q= all 404,
  # and /api/search answers 200 with {"articles":[],"authors":[],"tags":[]} for
  # every parameter name tried (query, q, s, term, searchTerm, text) - an API
  # that is always empty and never an error, which looks healthier than a 404.
  # The site ranks near-misses into the page, so the engine filters: one
  # /search page gave swedbank 100 rows, cloetta 100, granges 96 (including
  # press releases about *grants* and board *changes*) and the nonsense query
  # zzqxvv 1. A row is kept only when every term is a whole word in its title or
  # URL slug. No paging: &page=2, &p=2 and &offset=100 each return the same
  # 100-row page. The date comes from the slug (-YYYY-MM-DD editorial,
  # -YYYYMMDD wire) because the rendered date carries no year.
  # robots.txt (2026-10-30): `User-agent: *` is `Allow: /` with /admin/
  # disallowed; a second group naming ClaudeBot, Anthropic-ai, GPTBot, CCBot,
  # PerplexityBot and others disallows only /_next/image, /media/ and
  # /api/media/file/. A named group REPLACES `*`, so /search is allowed under
  # either, and this engine's SearXNG/1.0 matches no named group. No TDM
  # reservation (tdmrep.json 404, no meta, no X-Robots-Tag). Unlike `stooq`
  # above, nothing here needed an operator exception.
  # Rejected Swedish candidates, so they are not rediscovered: mfn.se
  # (Disallow: *.rss$), di.se and privataaffarer.se (Bonnier - ClaudeBot
  # blocked, §15a TDM reservation) are an operator decision like stooq, not an
  # engine author's; aktiespararna.se/sok?q= is the sii ?q= trap exactly (200,
  # 234,7xx bytes and the same five term hits for granges, swedbank AND a
  # nonsense query - the search is client-side and no backing API is named in
  # the markup); borsvarlden.se serves a certificate with no matching name.
  - name: placera
    engine: placera
    categories: [finance, finance-sweden]
    shortcut: pla
    disabled: false
  # News: duckduckgo news, wikinews (default on), qwant news and bing news answer.
  # None of the first three supports time_range, and SearXNG drops an engine that
  # does not when a range is set - so `-c news` + `time_range` ran ZERO engines and
  # returned an empty, error-free response. bing news supports it.
  #
  # CURRENT MEASUREMENT, 2026-10-30, q=kghm, this is the one to trust:
  #   categories=news, no range   -> 34 rows (duckduckgo news 27, bing news 9,
  #                                  wikinews 5; qwant news: access denied)
  #   time_range=day              ->  4 rows, all bing news
  #   time_range=week             ->  7 rows, all bing news
  #   time_range=month            ->  8 rows, all bing news
  #   engines=bing news, no range ->  9 rows, no unresponsive engine
  # bing news is healthy with enable_http3: false below. A reading taken
  # 2026-10-24 recorded ZERO rows and a bing news parsing error (empty response
  # body) and was carried in skills/searxng/references/categories.md; it does NOT
  # reproduce and that document has been corrected. Treat it as a transient
  # upstream blip, not as the state of this instance.
  #
  # Superseded figures, kept only so a reader does not compare them with the
  # above: 2026-10-15 recorded 10 unranged / 5 month / 3 week, and an earlier
  # probe that same day 8 at month while bing news was still failing on HTTP/3.
  #
  # google news ("access denied"), reuters (HTTP error, still on 2026-10-15) and
  # brave.news (crash) stay off. mojeek news, startpage news and yahoo news are
  # `inactive` upstream (proof-of-work captchas).
  #
  # enable_http3: false is the "connection error" recorded on 2026-10-10, and it
  # was never bing being down. bing_news.py sets enable_http3 = True, which sends
  # every request over QUIC; UDP/443 is filtered on this egress, so the transport
  # died before a request left and SearXNG answered "HTTP connection error" on
  # every attempt. Measured from inside the container on 2026-10-15:
  #   curl_cffi http_version=V3ONLY -> (56) ngtcp2_conn_writev_stream ERR_DRAINING
  #   curl_cffi http_version=V2_0   -> 200
  # SearXNG copies every settings key onto the engine module (searx/engines/
  # __init__.py, the setattr loop over engine_data), so this one line turns the
  # flag off without patching an upstream engine file.
  - name: qwant news
    disabled: false
  - name: bing news
    disabled: false
    enable_http3: false
  - name: google news
    disabled: true
  - name: reuters
    disabled: true
  - name: brave.news
    disabled: true
  # Three engines fail from this egress and are DELIBERATELY left enabled
  # (probed 2026-10-30, one pinned query each):
  #   wttr.in   - "parsing error"           (categories: weather, other)
  #   mozhi     - "HTTP connection error"   (categories: translate)
  #   geizhals  - "access denied"           (categories: shopping)
  # Disabling them would be the obvious move and it is the wrong one. None of
  # them is in `general`, `news` or any tab in categories_as_tabs above, so none
  # costs latency on an ordinary query - and each one's failure is the only thing
  # that distinguishes "this category is broken" from "this category found
  # nothing". `geizhals` is the sole engine in `shopping`: turn it off and
  # `categories=shopping` answers 0 results with an EMPTY .unresponsive_engines,
  # which is the healthy-looking empty this whole file exists to avoid. Leave
  # them on until they are fixed upstream or replaced.
  #
  # `weather`, `currency`, `define` and `translate` were recorded as dead
  # categories. They are not. Answerer-style engines put their entire output in
  # `.answers`, not `.results`, and the tool that measured them read `.results`
  # alone. Verified 2026-10-30: duckduckgo weather and openmeteo answer in
  # `weather`, `currency` answers, `wordnik` answers in `define`, and dictzone +
  # mymemory answer in `translate` - the last only for the required `from-to
  # term` form (`en-pl dog`; a bare `dog` yields nothing, which is the engine
  # API, not a fault). `sxq` now prints `.answers`.
