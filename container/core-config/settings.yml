# SearXNG settings for the local deployment (container/docker-compose.yml).
#
# Firecrawl (/opt/playground/firecrawl) uses this instance as its search provider:
#   GET {SEARXNG_ENDPOINT}/search?q=...&format=json
# so the JSON format MUST be enabled here. SearXNG ships with only `html`,
# which is why a misconfigured instance returns 200 and zero results - the
# response parses fine, it just has no .results array.
#
# Editing: this file is owned by the host user (FORCE_OWNERSHIP=false in
# container/.env), so edit it in place, then apply with
#   docker restart searxng-core
# Firecrawl needs no restart; it inherits whatever engines this enables and can
# only narrow them, via SEARXNG_ENGINES / SEARXNG_CATEGORIES /
# SEARXNG_NEWS_CATEGORIES in its own .env.
use_default_settings: true

general:
  instance_name: "local searxng"
  debug: false

server:
  # Bind on all interfaces inside the container. The host side is published on
  # SEARXNG_HOST (container/.env, the LAN address), which makes this an open
  # search proxy for the LAN: keep it off untrusted networks. (server.port is
  # ignored in the container, see SEARXNG_PORT in container/.env.)
  bind_address: "0.0.0.0"
  port: 8888
  # secret_key comes from SEARXNG_SECRET in container/.env.prod (gitignored).
  limiter: false
  image_proxy: false


search:
  formats:
    - html
    - json

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 20
  pool_maxsize: 10

# Engines probed from this egress IP on 2026-10-10 (q=..., engines=<one>):
# answering: yahoo, "duckduckgo web", mwmbl. Blocked: duckduckgo (CAPTCHA), brave and
# google cse (429, 180 s suspensions that slow every query), google ("access denied"),
# qwant (CAPTCHA), bing (connection error), yep. Re-probe before re-enabling one:
#   curl -G .../search --data-urlencode q=test --data-urlencode engines=<name> \
#     --data-urlencode format=json | jq '.results|length, .unresponsive_engines'
engines:
  - name: yahoo
    disabled: false
  - name: duckduckgo web
    disabled: false
  - name: mwmbl
    disabled: false
  - name: wikipedia
    disabled: false
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: google cse
    disabled: true
  # Developer (it/packages/repos): off by default upstream, answering here.
  # github, stackoverflow, askubuntu, superuser, mdn, pypi, docker hub are on by default.
  - name: npm
    disabled: false
  - name: pkg.go.dev
    disabled: false
  - name: lib.rs
    disabled: false
  - name: huggingface
    disabled: false
  - name: hackernews
    disabled: false
  # Liferay community forum (discuss.liferay.com). Not an upstream engine: added
  # here because use_default_settings appends unknown engine names. Verified
  # 2026-10-11 against search.json; Discourse 429s non-browser clients, which
  # SearXNG avoids via curl_cffi impersonation.
  - name: liferay forum
    engine: liferay_forum
    shortcut: lf
    categories: it
    disabled: false
  # SII - Stowarzyszenie Inwestorow Indywidualnych (sii.org.pl), Poland's
  # individual-investor association. Per-company commentary that names a GPW
  # ticker in the title, which is what makes it searchable. Not an upstream
  # engine. Verified 2026-10-11: /szukaj?search= returns 10 results each for
  # orlen, kghm, budimex and cd projekt.
  # Two traps, both handled in the engine and both worth not rediscovering.
  # The parameter is `search`, NOT `q`: ?q= answers HTTP 200 with one identical
  # 62,576-byte page for EVERY query including a nonsense one, so a wrong
  # parameter reads as a healthy engine that found nothing. And a query that
  # matches nothing answers 404, not an empty 200, so the engine sets
  # raise_for_httperror = False and returns zero results instead of failing.
  # robots.txt carries no AI-agent rule; `User-agent: *` disallows only asset
  # paths. The engine identifies as SearXNG/1.0: the site rejects a bare
  # "Mozilla/5.0" and "curl/8.5.0" with an empty shell but serves a full page
  # to any realistic agent string, so honesty costs nothing here.
  - name: sii
    engine: sii
    shortcut: sii
    disabled: false
  # DNA Rynkow (dnarynkow.pl) - per-company cards for ~100 listed names.
  # Not an upstream engine. Verified 2026-10-11.
  # The search is a PARAMETER on the stock index, not a search page: there is no
  # /szukaj route, no WordPress REST API and no sitemap entry for it, so every
  # path-shaped probe 404s while ?search= works. Two things that mislead:
  # the ~2.5 kB __NUXT_DATA__ payload holds no stock data - the result rows are
  # server-rendered into the HTML body, so a payload-only check concludes the
  # site is client-rendered; and `page` is 1-based in effect, since page=0 and
  # page=1 both return the first page.
  # robots.txt names ClaudeBot, Claude-User, Claude-SearchBot, GPTBot and a
  # dozen others under `Allow: /`; only /pulpit is disallowed and is never
  # requested here. Coverage is partial - Orlen has no card and returns zero.
  - name: dna rynkow
    engine: dnarynkow
    shortcut: dna
    disabled: false
  # Ksiazak (konradksiazak.pl) - a small office publishing long-form single-company
  # notes. Not an upstream engine. Verified 2026-10-11.
  # Do NOT judge this source by archive size. Six posts about six companies is the
  # product, not a shortfall: the question is "has this office written about a name
  # I hold?", where one hit is the signal and empty is the normal answer. An engine
  # that is rarely non-empty can be the highest-signal source in the set.
  # Reads the public WordPress REST API rather than scraping HTML.
  - name: ksiazak
    engine: ksiazak
    shortcut: ksz
    disabled: false
  # News: duckduckgo news, wikinews (default on), qwant news and bing news answer.
  # None of the first three supports time_range, and SearXNG drops an engine that
  # does not when a range is set - so `-c news` + `time_range` ran ZERO engines and
  # returned an empty, error-free response. bing news supports it. Re-probed
  # 2026-10-15, AFTER the enable_http3 fix below: 10 results with no range, 5 with
  # time_range=month, 3 with time_range=week, all attributed to bing news.
  # google news ("access denied"), reuters (HTTP error, still on 2026-10-15) and
  # brave.news (crash) stay off. mojeek news, startpage news and yahoo news are
  # `inactive` upstream (proof-of-work captchas).
  #
  # An earlier probe the same day recorded "8 with time_range=month". That was
  # taken while bing news was still failing - it is the HTTP/3 trap below, and the
  # figure should not be compared with the one above.
  #
  # enable_http3: false is the "connection error" recorded on 2026-10-10, and it
  # was never bing being down. bing_news.py sets enable_http3 = True, which sends
  # every request over QUIC; UDP/443 is filtered on this egress, so the transport
  # died before a request left and SearXNG answered "HTTP connection error" on
  # every attempt. Measured from inside the container on 2026-10-15:
  #   curl_cffi http_version=V3ONLY -> (56) ngtcp2_conn_writev_stream ERR_DRAINING
  #   curl_cffi http_version=V2_0   -> 200
  # SearXNG copies every settings key onto the engine module (searx/engines/
  # __init__.py, the setattr loop over engine_data), so this one line turns the
  # flag off without patching an upstream engine file.
  - name: qwant news
    disabled: false
  - name: bing news
    disabled: false
    enable_http3: false
  - name: google news
    disabled: true
  - name: reuters
    disabled: true
  - name: brave.news
    disabled: true
